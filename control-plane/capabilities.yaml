# Capabilities of the data plane behind this control plane.
#
# Generated by tools/dump-capabilities.sh from 1 node(s).
# Do not edit by hand -- re-run the script when the data plane changes.
#
# Types present on only some nodes are excluded: the control plane should not accept a
# definition that would fail depending on where it ran.
processors:
  ingest:
    - acl_routing
    - append
    - bytes
    - community_id
    - convert
    - copy
    - csv
    - date
    - date_index_name
    - dissect
    - dot_expander
    - drop
    - fail
    - fingerprint
    - foreach
    - geoip
    - grok
    - gsub
    - hierarchical_routing
    - html_strip
    - join
    - json
    - kv
    - lowercase
    - pipeline
    - remove
    - remove_by_pattern
    - rename
    - script
    - set
    - sort
    - split
    - split_to_fields
    - temporal_routing
    - trim
    - uppercase
    - urldecode
    - user_agent
  search_request:
    - acl_routing_search
    - filter_query
    - hierarchical_routing_search
    - oversample
    - script
    - temporal_routing_search
  search_response:
    - collapse
    - rename_field
    - sort
    - split
    - truncate_hits
  search_phase_results: []

# From GET /_script_language. With this present the control plane serves
# get_script_languages and validates the lang of a stored script; without it, both degrade.
script_languages:
  types_allowed: [inline, stored]
  language_contexts:
    expression:
      - aggregation_selector
      - aggs
      - bucket_aggregation
      - field
      - filter
      - number_sort
      - score
      - terms_set
    mustache:
      - template
    painless:
      - aggregation_selector
      - aggs
      - aggs_combine
      - aggs_init
      - aggs_map
      - aggs_reduce
      - analysis
      - bucket_aggregation
      - context_aware_grouping
      - derived_field
      - field
      - filter
      - ingest
      - interval
      - moving-function
      - number_sort
      - painless_test
      - processor_conditional
      - score
      - script_heuristic
      - search
      - similarity
      - similarity_weight
      - string_sort
      - template
      - terms_set
      - update
